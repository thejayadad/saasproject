services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: saas_dev
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: secure_saas

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_dev -d secure_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
